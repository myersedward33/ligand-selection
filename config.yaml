# Where the raw files live. Paths are relative to raw_dir, which is relative to
# the repository root unless absolute. Override with the LIGSEL_RAW_DIR env var.
# Raw files are never copied into the repository (see data/README.md).
raw_dir: ".."

files:
  kraken_2025:
    path: kraken_library.xlsx
    source: "Kraken descriptor library, 2025 release (Kraken_descriptors_2025_LATEST), https://kraken.cs.toronto.edu"
  kraken_2021_descriptors:
    path: KrakenJACS2021/ja1c09718_si_002/descriptors.xlsx
    source: "Gensch et al., JACS 2022, 144, 1205, SI file ja1c09718_si_002, https://doi.org/10.1021/jacs.1c09718"
  kraken_2021_model_scores:
    path: KrakenJACS2021/ja1c09718_si_002/descriptormodel_scores.xlsx
    source: "Gensch et al., JACS 2022, SI file ja1c09718_si_002"
  cliffs_main:
    path: ChemRXIV/chemrxiv.14388557.v1.pdf
    source: "Newman-Stonebraker et al., ChemRxiv 2021, https://doi.org/10.26434/chemrxiv.14388557.v1"
  cliffs_si:
    path: ChemRXIV/vbur_threshold_si_f.pdf
    source: "Supporting information to the ChemRxiv preprint above"
  jacs2022_main:
    path: NewmanStonebrakerJACS2022/NewmanStonebrakerJACS2022.pdf
    source: "Newman-Stonebraker et al., JACS 2022, 144, 19635, https://doi.org/10.1021/jacs.2c09840"
  jacs2022_si:
    path: NewmanStonebrakerJACS2022/SI.pdf
    source: "Supporting information to JACS 2022, 144, 19635"
  jacs2022_si_S2_p12_manual:
    path: manual/jacs2022_SI_tableS2_pageS12.csv
    source: "Hand transcription of JACS 2022 SI Table S2, page S12 (vector text, not extractable); see the file header"
  tepid_preprint:
    path: TEPid2023.pdf
    source: "Stevens et al., ChemRxiv 2023, https://doi.org/10.26434/chemrxiv-2023-wjnpj"

# Dataset roles from docs/preregistration.md. y_cut: yield (%) at or above which a ligand counts as
# active. Published cutoffs come from cliffs SI Table S8 and JACS 2022 SI Table S4; controls without
# a published cutoff use 10%, the most common one (an assumption, stated in the writeup).
min_match_rate: 0.95
datasets:
  cliffs_I:    {role: primary, metal: Ni, y_cut: 10}
  cliffs_II:   {role: primary, metal: Ni, y_cut: 10}
  cliffs_III:  {role: primary, metal: Ni, y_cut: 5}
  cliffs_IV:   {role: primary, metal: Ni, y_cut: 5}
  cliffs_V:    {role: primary, metal: Ni, y_cut: 20}
  cliffs_VII:  {role: primary, metal: Pd, y_cut: 10}
  cliffs_VIII: {role: primary, metal: Pd, y_cut: 10}
  cliffs_IX:   {role: primary, metal: Pd, y_cut: 10}
  cliffs_X:    {role: primary, metal: Pd, y_cut: 5}
  cliffs_XI:   {role: primary, metal: Pd, y_cut: 30}
  cliffs_XII:  {role: primary, metal: Pd, y_cut: 10}
  cliffs_RS1:  {role: supplementary, metal: Ni, y_cut: 10}
  cliffs_RS2:  {role: control, metal: Pd, y_cut: 10}
  cliffs_RS3:  {role: control, metal: Pd, y_cut: 10}
  cliffs_XIII: {role: control, metal: Pd, y_cut: 10}
  cliffs_XIV:  {role: control, metal: Pd, y_cut: 10}
  j22_IV:      {role: control, metal: Ni, y_cut: 24}
  j22_III:     {role: external, metal: Ni, y_cut: 10}
  j22_I:       {role: excluded, metal: Ni, y_cut: 10}
  j22_Ib:      {role: excluded, metal: Ni, y_cut: 10}
  j22_II:      {role: excluded, metal: Ni, y_cut: 20}

# Gate tolerances from docs/preregistration.md section 5
gate:
  threshold_tol: 0.11   # %V_bur(min)
  mcc_tol: 0.03
  min_datasets_passing: 10   # of the 11 primary datasets
